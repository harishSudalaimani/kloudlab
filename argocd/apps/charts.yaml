# One Application per Helm service:
#   clusters/<cluster>/<namespace>/<service>/app.yaml     repo, chart, version
#   clusters/<cluster>/<namespace>/<service>/values.yaml  chart values
# Name <service>-<cluster>, project and destination <cluster>.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: charts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/harishSudalaimani/kloudlab.git
        revision: main
        files:
          - path: clusters/*/*/*/app.yaml
  # removing a folder deletes the Application, never what it deployed
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ index .path.segments 3 }}-{{ index .path.segments 1 }}'
      labels:
        cluster: '{{ index .path.segments 1 }}'
        namespace: '{{ index .path.segments 2 }}'
    spec:
      project: '{{ index .path.segments 1 }}'
      sources:
        - repoURL: '{{ .repo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .version }}'
          helm:
            releaseName: '{{ index .path.segments 3 }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: https://github.com/harishSudalaimani/kloudlab.git
          targetRevision: main
          ref: values
      destination:
        name: '{{ index .path.segments 1 }}'
        namespace: '{{ index .path.segments 2 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
