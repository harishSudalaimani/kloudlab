# One Application per folder of plain manifests (no chart):
#   clusters/<cluster>/<namespace>/<service>/manifests/*.yaml
# Name <service>-<cluster>, project and destination <cluster>.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/harishSudalaimani/kloudlab.git
        revision: main
        directories:
          - path: clusters/*/*/*/manifests
  # removing a folder deletes the Application, never what it deployed
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ index .path.segments 3 }}-{{ index .path.segments 1 }}'
      labels:
        cluster: '{{ index .path.segments 1 }}'
        namespace: '{{ index .path.segments 2 }}'
    spec:
      project: '{{ index .path.segments 1 }}'
      source:
        repoURL: https://github.com/harishSudalaimani/kloudlab.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        name: '{{ index .path.segments 1 }}'
        namespace: '{{ index .path.segments 2 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
