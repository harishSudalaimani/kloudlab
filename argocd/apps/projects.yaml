# One AppProject per cluster: an app in clusters/<cluster>/ can deploy
# only to that cluster, and only from the listed sources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-management
  namespace: argocd
spec:
  description: Argo CD and platform services of the management cluster
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    # Helm OCI: Argo CD may need the form without oci:// (repo Secret
    # with enableOCI); both listed until checked
    - oci://cr.kgateway.dev/kgateway-dev/charts
    - cr.kgateway.dev/kgateway-dev/charts
  destinations:
    - name: kloudlab-management
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-app
  namespace: argocd
spec:
  description: Application workloads, OpenFGA and Karpenter
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
    - https://openfga.github.io/helm-charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - oci://cr.kgateway.dev/kgateway-dev/charts
    - cr.kgateway.dev/kgateway-dev/charts
  destinations:
    - name: kloudlab-app
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-observability
  namespace: argocd
spec:
  description: OpenTelemetry, Prometheus, Loki, Tempo and Grafana
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - oci://cr.kgateway.dev/kgateway-dev/charts
    - cr.kgateway.dev/kgateway-dev/charts
  destinations:
    - name: kloudlab-observability
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
