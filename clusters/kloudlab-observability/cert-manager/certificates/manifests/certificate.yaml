# One certificate per Gateway, a SAN for each of its hostnames.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-kgateway-tls
  namespace: kgateway-system
spec:
  secretName: grafana-kgateway-tls
  issuerRef:
    name: kloudlab-letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "grafana.kloudlab.in"
    - "monitoring.kloudlab.in"
