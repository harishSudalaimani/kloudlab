mode: deployment
fullnameOverride: otel-gateway
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.163.2
command:
  name: otelcol-contrib
serviceAccount:
  create: true
  name: otel-gateway
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # private IPs in public DNS, reached over VPC peering; never proxied
    external-dns.alpha.kubernetes.io/hostname: otel.kloudlab.in
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  loadBalancerSourceRanges:
    - 10.10.0.0/16
    - 10.20.0.0/16
    - 10.30.0.0/16
    - 10.40.0.0/16
extraVolumes:
  - name: otel-gateway-tls
    secret:
      secretName: kloudlab-otel-gateway-server-tls
extraVolumeMounts:
  - name: otel-gateway-tls
    mountPath: /etc/otel-gateway/tls
    readOnly: true
extraEnvs:
  - name: OTEL_GATEWAY_TOKEN
    valueFrom:
      secretKeyRef:
        name: kloudlab-otel-gateway-server
        key: token
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: k8s.cluster.name=kloudlab-observability
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
          auth:
            authenticator: bearertokenauth
          tls:
            cert_file: /etc/otel-gateway/tls/tls.crt
            key_file: /etc/otel-gateway/tls/tls.key
        http:
          endpoint: ${env:MY_POD_IP}:4318
          auth:
            authenticator: bearertokenauth
          tls:
            cert_file: /etc/otel-gateway/tls/tls.crt
            key_file: /etc/otel-gateway/tls/tls.key
  exporters:
    otlp/tempo:
      endpoint: tempo-distributed-distributor.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      logs_endpoint: http://loki-gateway.observability.svc.cluster.local/otlp/v1/logs
    prometheus:
      endpoint: ${env:MY_POD_IP}:8888
      resource_to_telemetry_conversion:
        enabled: true
  extensions:
    bearertokenauth:
      scheme: Bearer
      token: ${env:OTEL_GATEWAY_TOKEN}
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 5s
      send_batch_size: 1024
  service:
    telemetry:
      metrics:
        readers: []
    extensions:
      - health_check
      - bearertokenauth
    pipelines:
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo
ports:
  otlp:
    enabled: true
    hostPort: 0
  otlp-http:
    enabled: true
    hostPort: 0
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi
