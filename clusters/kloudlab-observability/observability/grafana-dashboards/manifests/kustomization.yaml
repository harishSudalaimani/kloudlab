apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-dashboard-kloudlab-api
    files:
      - dashboards/kloudlab-api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-kloudlab-kubernetes
    files:
      - dashboards/kloudlab-kubernetes.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-kloudlab-workloads
    files:
      - dashboards/kloudlab-workloads.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-kloudlab-logs
    files:
      - dashboards/kloudlab-logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-kloudlab-traces
    files:
      - dashboards/kloudlab-traces.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
