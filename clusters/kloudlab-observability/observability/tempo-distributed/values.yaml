fullnameOverride: tempo-monolithic
replicas: 1

serviceAccount:
  create: true
  name: kloudlab-tempo

tempo:
  multitenancyEnabled: false
  reportingEnabled: false
  retention: 168h
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  storage:
    trace:
      backend: s3
      s3:
        bucket: kloudlab-observability-tempo
        endpoint: s3.ap-south-1.amazonaws.com
        region: ap-south-1
      wal:
        path: /var/tempo/wal

persistence:
  enabled: true
  storageClassName: gp3
  size: 10Gi
