serviceAccount:
  create: true
  name: kloudlab-tempo

multitenancyEnabled: false

storage:
  trace:
    backend: s3
    s3:
      bucket: kloudlab-observability-tempo
      region: ap-south-1

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true
  jaeger:
    thriftHttp:
      enabled: false
  zipkin:
    enabled: false

distributor:
  replicas: 2
ingester:
  replicas: 1
querier:
  replicas: 1
queryFrontend:
  replicas: 1

# Tempo 3.0's Kafka write path (block-builder, live-store) needs a Kafka
# broker; this POC keeps the classic ingester path without Kafka.
blockBuilder:
  enabled: false
liveStore:
  enabled: false

tempo:
  structuredConfig:
    backend_worker:
      compaction:
        block_retention: 168h

minio:
  enabled: false
