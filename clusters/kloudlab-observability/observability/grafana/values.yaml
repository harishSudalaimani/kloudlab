admin:
  existingSecret: kloudlab-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP

ingress:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo-distributed-query-frontend.observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: 1h
            spanEndTimeShift: -1h

# Served at grafana.kloudlab.in (Gateway grafana in kgateway-system).
grafana.ini:
  server:
    root_url: https://grafana.kloudlab.in
