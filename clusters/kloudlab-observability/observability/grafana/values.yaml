admin:
  existingSecret: kloudlab-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP

ingress:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo-monolithic.observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: 1h
            spanEndTimeShift: -1h

# Load dashboards from labelled ConfigMaps managed by the adjacent GitOps app.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    provider:
      name: kloudlab-dashboards
      orgid: 1
      folder: KloudLab
      type: file
      disableDelete: false
      allowUiUpdates: false

# Served at monitoring.kloudlab.in and grafana.kloudlab.in (Gateway grafana
# in kgateway-system).
grafana.ini:
  server:
    root_url: https://monitoring.kloudlab.in
