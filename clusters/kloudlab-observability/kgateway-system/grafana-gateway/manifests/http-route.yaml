apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kgateway-system
spec:
  parentRefs:
    - name: grafana
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
  hostnames:
    - "grafana.kloudlab.in"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          group: ""
          kind: Service
          namespace: observability
          port: 80
          weight: 1
