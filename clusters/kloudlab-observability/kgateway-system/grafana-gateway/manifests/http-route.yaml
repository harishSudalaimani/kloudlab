apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kgateway-system
spec:
  parentRefs:
    - name: grafana
      namespace: kgateway-system
  hostnames:
    - "grafana.kloudlab.in"
  rules:
    - backendRefs:
        - name: grafana
          namespace: observability
          port: 80
