apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "grafana.kloudlab.in"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-kgateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kloudlab.dev/gateway-access: "public"
    - name: https-monitoring
      protocol: HTTPS
      port: 443
      hostname: "monitoring.kloudlab.in"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-kgateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kloudlab.dev/gateway-access: "public"
