provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-api-token
        key: api-token

sources:
  - gateway-httproute

domainFilters:
  - kloudlab.in

# Three clusters write to one Cloudflare zone: each owns only its own
# records (chart default owner id is "default" on all of them).
txtOwnerId: kloudlab-app

# Public hostnames go through the Cloudflare proxy (orange cloud); a
# record opts out with the annotation
# external-dns.alpha.kubernetes.io/cloudflare-proxied: "false".
extraArgs:
  - --cloudflare-proxied
