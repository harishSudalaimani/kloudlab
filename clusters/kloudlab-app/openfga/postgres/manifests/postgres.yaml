# Single-instance PostgreSQL for OpenFGA (POC). The Secret
# openfga-postgres (keys: password, uri) is created once by hand, not
# from Git.
apiVersion: v1
kind: Service
metadata:
  name: openfga-postgres
  labels:
    app.kubernetes.io/name: openfga-postgres
spec:
  selector:
    app.kubernetes.io/name: openfga-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openfga-postgres
  labels:
    app.kubernetes.io/name: openfga-postgres
spec:
  serviceName: openfga-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga-postgres
    spec:
      securityContext:
        # uid and gid of the postgres user in the alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: openfga
            - name: POSTGRES_DB
              value: openfga
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openfga-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "openfga", "-d", "openfga"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "openfga", "-d", "openfga"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 10Gi
