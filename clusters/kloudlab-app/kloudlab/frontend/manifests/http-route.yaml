# kloudlab.in on the public Gateway (HTTPS listener https-apex).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kloudlab-frontend
  labels:
    app.kubernetes.io/name: kloudlab-frontend
    app.kubernetes.io/part-of: kloudlab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: kgateway-system
      sectionName: https-apex
  hostnames:
    - "kloudlab.in"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kloudlab-frontend
          group: ""
          kind: Service
          port: 8080
          weight: 1
---
# www.kloudlab.in redirects to the apex: the API allows one CORS
# origin (https://kloudlab.in).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kloudlab-www-redirect
  labels:
    app.kubernetes.io/part-of: kloudlab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: kgateway-system
      sectionName: https-www
  hostnames:
    - "www.kloudlab.in"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: kloudlab.in
            statusCode: 301
