# kloudlab.in on the public Gateway (HTTPS listener https-apex).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kloudlab-frontend
  labels:
    app.kubernetes.io/name: kloudlab-frontend
    app.kubernetes.io/part-of: kloudlab
spec:
  parentRefs:
    - name: public
      namespace: kgateway-system
      sectionName: https-apex
  hostnames:
    - "kloudlab.in"
  rules:
    - backendRefs:
        - name: kloudlab-frontend
          port: 8080
---
# www.kloudlab.in redirects to the apex: the API allows one CORS
# origin (https://kloudlab.in).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kloudlab-www-redirect
  labels:
    app.kubernetes.io/part-of: kloudlab
spec:
  parentRefs:
    - name: public
      namespace: kgateway-system
      sectionName: https-www
  hostnames:
    - "www.kloudlab.in"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: kloudlab.in
            statusCode: 301
