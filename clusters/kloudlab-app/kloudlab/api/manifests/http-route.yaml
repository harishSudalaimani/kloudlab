# api.kloudlab.in on the public Gateway (HTTPS listener https-api).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kloudlab-api
  labels:
    app.kubernetes.io/name: kloudlab-api
    app.kubernetes.io/part-of: kloudlab
spec:
  parentRefs:
    - name: public
      namespace: kgateway-system
      sectionName: https-api
  hostnames:
    - "api.kloudlab.in"
  rules:
    - backendRefs:
        - name: kloudlab-api
          port: 8080
