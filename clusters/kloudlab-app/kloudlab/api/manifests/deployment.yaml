# KloudLab API. Hand-made Secrets in namespace kloudlab (not in Git):
#   kloudlab-api   keys openfga-api-token, database-url
#   ghcr-pull      kubernetes.io/dockerconfigjson for ghcr.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudlab-api
  labels:
    app.kubernetes.io/name: kloudlab-api
    app.kubernetes.io/part-of: kloudlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kloudlab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloudlab-api
        app.kubernetes.io/part-of: kloudlab
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        # nonroot user of the distroless image
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/harishsudalaimani/kloudlab-api:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kloudlab-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kloudlab-api
                  key: database-url
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kloudlab-api
                  key: openfga-api-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
