# Single-instance PostgreSQL for the KloudLab API (POC), same pattern
# as openfga/postgres. The Secret kloudlab-api-postgres (key: password)
# is created once by hand, not from Git. StorageClass gp3-encrypted
# exists cluster-wide (openfga/postgres).
apiVersion: v1
kind: Service
metadata:
  name: kloudlab-api-postgres
  labels:
    app.kubernetes.io/name: kloudlab-api-postgres
    app.kubernetes.io/part-of: kloudlab
spec:
  selector:
    app.kubernetes.io/name: kloudlab-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kloudlab-api-postgres
  annotations:
    argocd.argoproj.io/ignore-differences: |
      jsonPointers:
        - /spec/volumeClaimTemplates/0/status
  labels:
    app.kubernetes.io/name: kloudlab-api-postgres
    app.kubernetes.io/part-of: kloudlab
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  serviceName: kloudlab-api-postgres
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: kloudlab-api-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloudlab-api-postgres
        app.kubernetes.io/part-of: kloudlab
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid and gid of the postgres user in the alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: kloudlab
            - name: POSTGRES_DB
              value: kloudlab
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kloudlab-api-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kloudlab", "-d", "kloudlab"]
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kloudlab", "-d", "kloudlab"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 10Gi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
