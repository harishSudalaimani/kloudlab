apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "argocd.kloudlab.in"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-kgateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kloudlab.dev/gateway-access: "public"
