apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: kgateway-system
spec:
  parentRefs:
    - name: argocd
      namespace: kgateway-system
  hostnames:
    - "argocd.kloudlab.in"
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
