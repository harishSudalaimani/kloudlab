# Let's Encrypt, DNS-01 via Cloudflare. The token Secret lives in the
# cert-manager namespace (cluster resource namespace).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kloudlab-letsencrypt
spec:
  acme:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: kloudlab-letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-api-token
              key: api-token
