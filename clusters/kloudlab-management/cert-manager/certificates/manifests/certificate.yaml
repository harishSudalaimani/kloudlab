# One certificate per Gateway, a SAN for each of its hostnames.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-kgateway-tls
  namespace: kgateway-system
spec:
  secretName: argocd-kgateway-tls
  issuerRef:
    name: kloudlab-letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "argocd.kloudlab.in"
