gatewayParameters:
  enabled: true
  name: public-aws-nlb
  proxyReplicas: 2
  service:
    extraAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

gateway:
  enabled: true
  name: public
  className: kgateway
  listener:
    name: http
    protocol: HTTP
    port: 80
    hostname: ""
    tls:
      enabled: false
      certificateRef: ""
    routeNamespaceLabel:
      key: kloudlab.dev/gateway-access
      value: public

httpRoute:
  enabled: false
  name: ""
  namespace: ""
  hostname: ""
  parentGateway: public
  backend:
    name: ""
    namespace: ""
    port: 80
  referenceGrant:
    enabled: false

namespaceLabels:
  enabled: false
  kloudlab.dev/gateway-access: public
