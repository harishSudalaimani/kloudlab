{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name }}
  namespace: {{ .Values.httpRoute.namespace | default .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentGateway }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.httpRoute.backend.name }}
          namespace: {{ .Values.httpRoute.backend.namespace | default .Release.Namespace }}
          port: {{ .Values.httpRoute.backend.port }}
{{- end }}
