{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: {{ .Values.gateway.listener.name }}
      protocol: {{ .Values.gateway.listener.protocol }}
      port: {{ .Values.gateway.listener.port }}
      {{- with .Values.gateway.listener.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- if .Values.gateway.listener.tls.enabled }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.listener.tls.certificateRef }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.gateway.listener.routeNamespaceLabel.key }}: {{ .Values.gateway.listener.routeNamespaceLabel.value | quote }}
{{- end }}
