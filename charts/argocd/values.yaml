argo-cd:
  global:
    networkPolicy:
      create: false
  controller:
    # The EKS auth plugin uses the management cluster's Pod Identity role.
    env:
      - name: AWS_REGION
        value: ap-south-1
  server:
    service:
      type: ClusterIP
  configs:
    params:
      server.insecure: "true"
    cm:
      url: https://argocd.kloudlab.in
