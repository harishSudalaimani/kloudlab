apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity-database-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: {{ include "identity-database-bootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    export PGSSLMODE=require
    export PGPORT="${PGPORT:-5432}"

    echo "Waiting for the private PostgreSQL endpoint..."
    attempt=0
    until pg_isready --host "$PGHOST" --port "$PGPORT" --username "$PGUSER" --dbname "$PGDATABASE"; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 60 ]; then
        echo "PostgreSQL did not become ready before the timeout." >&2
        exit 1
      fi
      sleep 10
    done

    psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
    \getenv admin_role PGUSER
    \getenv infisical_password INFISICAL_DB_PASSWORD
    \getenv openfga_password OPENFGA_DB_PASSWORD
    \set infisical_role {{ .Values.bootstrap.databases.infisical.role }}
    \set infisical_database {{ .Values.bootstrap.databases.infisical.name }}
    \set openfga_role {{ .Values.bootstrap.databases.openfga.role }}
    \set openfga_database {{ .Values.bootstrap.databases.openfga.name }}

    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'infisical_role', :'infisical_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'infisical_role')
    \gexec
    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'infisical_role', :'infisical_password')
    \gexec
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'openfga_role', :'openfga_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'openfga_role')
    \gexec
    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'openfga_role', :'openfga_password')
    \gexec

    -- RDS master users are not PostgreSQL superusers. Grant membership so the
    -- bootstrap user can create and transfer ownership of each database.
    SELECT format('GRANT %I TO %I', :'infisical_role', :'admin_role')
    \gexec
    SELECT format('GRANT %I TO %I', :'openfga_role', :'admin_role')
    \gexec

    SELECT format('CREATE DATABASE %I OWNER %I', :'infisical_database', :'infisical_role')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'infisical_database')
    \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'infisical_database', :'infisical_role')
    \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'openfga_database', :'openfga_role')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'openfga_database')
    \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'openfga_database', :'openfga_role')
    \gexec

    SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'infisical_database')
    \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'infisical_database', :'infisical_role')
    \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'infisical_database', :'admin_role')
    \gexec
    SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'openfga_database')
    \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'openfga_database', :'openfga_role')
    \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'openfga_database', :'admin_role')
    \gexec
    SELECT format('REVOKE %I FROM %I', :'infisical_role', :'admin_role')
    \gexec
    SELECT format('REVOKE %I FROM %I', :'openfga_role', :'admin_role')
    \gexec
    SQL

    echo "Identity service databases and roles are ready."
