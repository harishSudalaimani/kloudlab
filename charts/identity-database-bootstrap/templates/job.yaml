apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity-database-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "identity-database-bootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "identity-database-bootstrap.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.postgresImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          envFrom:
            - secretRef:
                name: {{ .Values.bootstrap.secretName | quote }}
          env:
            - name: PGSSLMODE
              value: require
            - name: PGPORT
              value: "5432"
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: {{ include "identity-database-bootstrap.name" . }}
            defaultMode: 0555
