name: Images

# Build API and frontend independently, publish each image to ECR, and promote
# every successful build to GitOps. Argo CD deploys the GitOps commit.
# The publisher role needs ecr:BatchGetImage to update the mutable :main tags.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/frontend/**"
      - "clusters/kloudlab-app/kloudlab/api/manifests/configmap.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ECR publishing role
        env:
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          if [[ "$AWS_ECR_PUBLISH_ROLE_ARN" != arn:aws:iam::481665121849:role/* ]]; then
            echo "Set AWS_ECR_PUBLISH_ROLE_ARN to a role ARN in account 481665121849." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: kloudlab-images-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/kloudlab-api:main
            ${{ steps.ecr.outputs.registry }}/kloudlab-api:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kloudlab-api
          cache-to: type=gha,mode=max,scope=kloudlab-api

  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ECR publishing role
        env:
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          if [[ "$AWS_ECR_PUBLISH_ROLE_ARN" != arn:aws:iam::481665121849:role/* ]]; then
            echo "Set AWS_ECR_PUBLISH_ROLE_ARN to a role ARN in account 481665121849." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: kloudlab-images-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/kloudlab-frontend:main
            ${{ steps.ecr.outputs.registry }}/kloudlab-frontend:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN || 'dev-rfog4fw2atmd5wrd.us.auth0.com' }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID || 'gNuTg6P3eMIERdxAtowzW76AU7ihqP2L' }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE || 'https://api.kloudlab.in' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.kloudlab.in/api' }}
          cache-from: type=gha,scope=kloudlab-frontend
          cache-to: type=gha,mode=max,scope=kloudlab-frontend

  update-gitops:
    name: Promote successful images to GitOps
    needs: [build-api, build-frontend]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs['build-api'].result == 'success' || needs['build-frontend'].result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check source freshness
        id: freshness
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_source_commit="$(git log -1 --format=%H origin/main -- \
            apps/api apps/frontend \
            clusters/kloudlab-app/kloudlab/api/manifests/configmap.yaml \
            .github/workflows/images.yml)"
          if ! git merge-base --is-ancestor "$latest_source_commit" "$EVENT_SHA"; then
            echo "Skipping stale image build for $EVENT_SHA; latest relevant main commit is $latest_source_commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Update successful image tags
        if: steps.freshness.outputs.current == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          UPDATE_API: ${{ needs['build-api'].result == 'success' }}
          UPDATE_FRONTEND: ${{ needs['build-frontend'].result == 'success' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"][:7]
          images = {
              "api": ("clusters/kloudlab-app/kloudlab/api/manifests/deployment.yaml", "kloudlab-api", "UPDATE_API"),
              "frontend": ("clusters/kloudlab-app/kloudlab/frontend/manifests/deployment.yaml", "kloudlab-frontend", "UPDATE_FRONTEND"),
          }
          changed = []
          for path, image, result_var in images.values():
              if os.environ[result_var] != "true":
                  print(f"Leaving {image} unchanged because its image build did not succeed.")
                  continue
              file = Path(path)
              content = file.read_text()
              updated, count = re.subn(
                  rf"(?m)^(\s*image:\s*).*/{re.escape(image)}:[^\s]+$",
                  rf"\g<1>481665121849.dkr.ecr.ap-south-1.amazonaws.com/{image}:{tag}",
                  content,
              )
              if count != 1:
                  raise SystemExit(f"expected one {image} image in {path}, found {count}")
              if updated != content:
                  file.write_text(updated)
                  changed.append(path)
          if not changed:
              print(f"GitOps already uses image tag {tag} for all successful builds.")
          PY

      - name: Commit and push GitOps image update
        if: steps.freshness.outputs.current == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          EVENT_SHA: ${{ github.sha }}
          UPDATE_API: ${{ needs['build-api'].result == 'success' }}
          UPDATE_FRONTEND: ${{ needs['build-frontend'].result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            clusters/kloudlab-app/kloudlab/api/manifests/deployment.yaml \
            clusters/kloudlab-app/kloudlab/frontend/manifests/deployment.yaml
          if git diff --cached --quiet; then
            echo "No GitOps image changes to commit for ${IMAGE_TAG:0:7}."
            exit 0
          fi
          git commit -m "chore(gitops): deploy app images ${IMAGE_TAG:0:7}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Push raced with another main commit; refreshing manifests and retrying (attempt $((attempt + 1))/3)."
              git fetch origin main
              git reset --hard origin/main
              latest_source_commit="$(git log -1 --format=%H origin/main -- \
                apps/api apps/frontend \
                clusters/kloudlab-app/kloudlab/api/manifests/configmap.yaml \
                .github/workflows/images.yml)"
              if [[ -z "$latest_source_commit" ]]; then
                echo "Could not find the latest image source commit on main." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$latest_source_commit" "$EVENT_SHA"; then
                echo "A newer image source commit landed during promotion; skipping stale image tags."
                exit 0
              fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"][:7]
          images = {
              "api": ("clusters/kloudlab-app/kloudlab/api/manifests/deployment.yaml", "kloudlab-api", "UPDATE_API"),
              "frontend": ("clusters/kloudlab-app/kloudlab/frontend/manifests/deployment.yaml", "kloudlab-frontend", "UPDATE_FRONTEND"),
          }
          for path, image, result_var in images.values():
              if os.environ[result_var] != "true":
                  continue
              file = Path(path)
              content = file.read_text()
              updated, count = re.subn(
                  rf"(?m)^(\s*image:\s*).*/{re.escape(image)}:[^\s]+$",
                  rf"\g<1>481665121849.dkr.ecr.ap-south-1.amazonaws.com/{image}:{tag}",
                  content,
              )
              if count != 1:
                  raise SystemExit(f"expected one {image} image in {path}, found {count}")
              file.write_text(updated)
          PY
              git add \
                clusters/kloudlab-app/kloudlab/api/manifests/deployment.yaml \
                clusters/kloudlab-app/kloudlab/frontend/manifests/deployment.yaml
              if git diff --cached --quiet; then
                echo "GitOps already contains the successful image tags."
                exit 0
              fi
              git commit -m "chore(gitops): deploy app images ${IMAGE_TAG:0:7}"
            fi
          done
          echo "Could not push the GitOps image update after 3 attempts." >&2
          exit 1
