name: Images

# Builds the API and frontend images and pushes them to GHCR with tags
# main and the short commit SHA. The frontend's VITE_* values are
# public build-time settings from repository variables (Settings >
# Secrets and variables > Actions > Variables).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/frontend/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kloudlab-api
            context: apps/api
          - name: kloudlab-frontend
            context: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/harishsudalaimani/${{ matrix.name }}:main
            ghcr.io/harishsudalaimani/${{ matrix.name }}:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # ignored by the API Dockerfile (no such ARGs there)
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN || 'REPLACE_ME.auth0.com' }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID || 'REPLACE_ME' }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE || 'REPLACE_ME' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.kloudlab.in/api' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
