apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-app
  namespace: argocd
spec:
  description: Applications and platform services for the KloudLab application cluster.
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
  destinations:
    - name: kloudlab-app
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
