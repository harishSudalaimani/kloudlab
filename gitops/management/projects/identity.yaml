apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Applications and platform services for the KloudLab identity cluster.
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
  destinations:
    - name: kloudlab-identity
      namespace: kloudlab-identity
    - name: kloudlab-identity
      namespace: opentelemetry
    - name: kloudlab-identity
      namespace: external-secrets
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: kloudlab-identity
    - group: ""
      kind: Namespace
      name: opentelemetry
    - group: ""
      kind: Namespace
      name: external-secrets
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: otel-cluster-collector*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: otel-cluster-collector*
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: external-secrets*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: external-secrets*
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: "*.external-secrets.io"
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: coordination.k8s.io
      kind: Lease
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret
    - group: ""
      kind: PersistentVolumeClaim
