apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-identity
  namespace: argocd
spec:
  description: Applications and platform services for the KloudLab identity cluster.
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
  destinations:
    - name: kloudlab-identity
      namespace: kube-system
    - name: kloudlab-identity
      namespace: kloudlab-identity
    - name: kloudlab-identity
      namespace: opentelemetry
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: kloudlab-identity
    - group: ""
      kind: Namespace
      name: opentelemetry
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: "*.cilium.io"
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cilium*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: cilium*
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: otel-cluster-collector*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: otel-cluster-collector*
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: coordination.k8s.io
      kind: Lease
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
