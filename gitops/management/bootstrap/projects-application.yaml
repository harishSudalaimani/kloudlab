apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-management-projects
  namespace: argocd
spec:
  # Argo CD's built-in project is the one-time seed. There is no separate
  # kloudlab-bootstrap AppProject.
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/management/projects
    directory:
      recurse: false
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

