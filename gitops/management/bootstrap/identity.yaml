apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/management
    directory:
      include: "{projects/identity.yaml,workload-roots/identity.yaml}"
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
