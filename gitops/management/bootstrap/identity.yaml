apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      path: gitops/management/projects
      directory:
        include: identity.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      path: gitops/management/workload-roots
      directory:
        include: identity.yaml
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
