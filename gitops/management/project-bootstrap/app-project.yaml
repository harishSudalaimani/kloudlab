apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-app-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kloudlab-bootstrap
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/management/projects
    directory:
      recurse: false
      include: app.yaml
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
