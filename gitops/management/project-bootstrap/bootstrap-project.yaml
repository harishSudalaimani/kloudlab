apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kloudlab-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Restricted control-plane project for Argo CD root Applications and AppProjects.
  sourceRepos:
    - https://github.com/harishSudalaimani/kloudlab.git
  destinations:
    - name: in-cluster
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
