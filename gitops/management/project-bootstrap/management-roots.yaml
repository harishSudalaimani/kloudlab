apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-management-roots
  namespace: argocd
spec:
  project: kloudlab-bootstrap
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/management/roots
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
