apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-management-roots
  namespace: argocd
spec:
  project: kloudlab-management
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/management/roots
    directory:
      recurse: false
      # Temporarily keep the Pulumi-owned Cilium root out of Argo's resource set.
      include: "management-gateway.yaml"
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
