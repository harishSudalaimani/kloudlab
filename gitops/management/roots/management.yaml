apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-management-applications
  namespace: argocd
spec:
  project: kloudlab-management
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/clusters/management/applications/cilium
    directory:
      recurse: false
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
