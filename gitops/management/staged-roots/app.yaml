apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-app-applications
  namespace: argocd
spec:
  project: kloudlab-management
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/clusters/app/applications
    directory:
      recurse: true
      include: "**/application.yaml"
  destination:
    name: in-cluster
    namespace: argocd
  # Deliberately manual: sync app only after identity is ready.
