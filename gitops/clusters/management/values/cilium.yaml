cilium:
  # The management cluster already has kube-proxy installed. Argo CD first
  # installs Cilium with replacement enabled; Pulumi then removes the EKS
  # kube-proxy add-on after Cilium is healthy.
  cni:
    chainingMode: aws-cni
    exclusive: false

  kubeProxyReplacement: true
  # EKS does not create kube-public/cluster-info. Use the control-plane
  # endpoint directly so Cilium can reach the API after kube-proxy is removed.
  k8sServiceHost: 8FE04912ADCCFE2C713475C37EAB88DA.gr7.ap-south-1.eks.amazonaws.com
  k8sServicePort: "443"

  routingMode: native
  enableIPv4Masquerade: false

  gatewayAPI:
    enabled: false
