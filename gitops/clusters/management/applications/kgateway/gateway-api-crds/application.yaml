apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    path: charts/kgateway/gateway-api-crds
    targetRevision: main
    helm:
      releaseName: gateway-api-crds
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - Delete=false
