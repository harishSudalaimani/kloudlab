apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-cert-manager-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/cert-manager-resources
      targetRevision: main
      helm:
        releaseName: cert-manager-resources
        valueFiles:
          - $values/gitops/clusters/management/values/cert-manager-resources.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
