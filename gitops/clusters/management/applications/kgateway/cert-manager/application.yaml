apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: kloudlab-management
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    path: charts/cert-manager
    targetRevision: main
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
  destination:
    name: in-cluster
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
