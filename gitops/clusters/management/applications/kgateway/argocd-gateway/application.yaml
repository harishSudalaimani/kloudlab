apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-argocd-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: kloudlab-management
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/kgateway/resources
      targetRevision: main
      helm:
        releaseName: argocd-gateway
        valueFiles:
          - $values/gitops/clusters/management/values/kgateway-argocd-gateway.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
