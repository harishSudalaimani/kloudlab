apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kgateway-parameters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: kloudlab-management
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    path: charts/kgateway/resources
    targetRevision: main
    helm:
      releaseName: kgateway-parameters
      values: |
        gateway:
          enabled: false
        httpRoute:
          enabled: false
  destination:
    name: in-cluster
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
