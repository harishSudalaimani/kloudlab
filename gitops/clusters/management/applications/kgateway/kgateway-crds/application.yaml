apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    path: charts/kgateway/crds
    targetRevision: main
  destination:
    name: in-cluster
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
