apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/kgateway/controller
      targetRevision: main
      helm:
        releaseName: kgateway
        valueFiles:
          - $values/gitops/clusters/management/values/kgateway.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
