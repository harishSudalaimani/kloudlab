apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/clusters/app/applications
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
