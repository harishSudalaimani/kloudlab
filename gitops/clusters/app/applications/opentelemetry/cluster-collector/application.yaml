apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-app-otel-cluster-collector
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.177.0
      helm:
        releaseName: otel-cluster-collector
        valueFiles:
          - $values/gitops/clusters/app/applications/opentelemetry/cluster-collector/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-app
    namespace: opentelemetry
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
