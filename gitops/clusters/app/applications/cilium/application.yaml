apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    # Install the service datapath before kgateway and app workloads.
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: kloudlab-app
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/cilium
      targetRevision: main
      helm:
        releaseName: cilium
        valueFiles:
          - $values/gitops/clusters/app/values/cilium.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-app
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
