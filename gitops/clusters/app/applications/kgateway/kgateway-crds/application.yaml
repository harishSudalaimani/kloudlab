apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: cr.kgateway.dev/kgateway-dev/charts
    chart: kgateway-crds
    targetRevision: v2.4.3
    helm:
      skipCrds: false
  destination:
    name: kloudlab-app
    namespace: kgateway-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
