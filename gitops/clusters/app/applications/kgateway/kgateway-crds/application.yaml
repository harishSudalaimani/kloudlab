apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: kloudlab-app
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    path: charts/kgateway/crds
    targetRevision: main
    helm:
      skipCrds: false
  destination:
    name: kloudlab-app
    namespace: kgateway-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
