apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgateway-public-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: charts/kgateway/resources
    helm:
      releaseName: kgateway-public-gateway
      values: |
        gatewayParameters:
          enabled: false
        namespaceLabels:
          enabled: true
          kloudlab.dev/gateway-access: public
  destination:
    name: kloudlab-app
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
