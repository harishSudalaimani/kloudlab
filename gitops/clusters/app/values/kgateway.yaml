kgateway:
  # kgateway controller Helm values for the kloudlab-app EKS cluster.
  # Keep the control plane private; only the Envoy proxy Service is public.
  controller:
    replicaCount: 2
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gatewayClassParametersRefs:
    kgateway:
      name: public-aws-nlb
      namespace: kgateway-system

  validation:
    level: strict
