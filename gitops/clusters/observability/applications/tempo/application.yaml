apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo-distributed
      targetRevision: 3.17.0
      helm:
        releaseName: tempo-distributed
        valueFiles:
          - $values/gitops/clusters/observability/applications/tempo/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
