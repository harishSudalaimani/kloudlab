apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-observability-cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: kloudlab-observability
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/cilium
      targetRevision: main
      helm:
        releaseName: cilium
        valueFiles:
          - $values/gitops/clusters/observability/values/cilium.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
