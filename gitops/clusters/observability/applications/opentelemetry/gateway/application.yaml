apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-observability-otel-gateway
  namespace: argocd
spec:
  project: kloudlab-observability
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/observability/opentelemetry-collector
      targetRevision: main
      helm:
        releaseName: otel-gateway
        valueFiles:
          - $values/gitops/clusters/observability/applications/opentelemetry/gateway/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: opentelemetry
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
