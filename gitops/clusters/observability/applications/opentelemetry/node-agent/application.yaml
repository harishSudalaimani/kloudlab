apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-observability-otel-node-agent
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.177.0
      helm:
        releaseName: otel-node-agent
        valueFiles:
          - $values/gitops/clusters/observability/applications/opentelemetry/node-agent/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: opentelemetry
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
