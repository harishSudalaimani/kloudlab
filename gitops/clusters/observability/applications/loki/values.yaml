loki:
  serviceAccount:
    create: true
    name: kloudlab-loki

  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: kloudlab-observability-loki
        ruler: kloudlab-observability-loki
        admin: kloudlab-observability-loki
      s3:
        region: ap-south-1
    limits_config:
      allow_structured_metadata: true
      retention_period: 720h
    compactor:
      retention_enabled: true
      delete_request_store: s3

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: gp3

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: true

  minio:
    enabled: false
