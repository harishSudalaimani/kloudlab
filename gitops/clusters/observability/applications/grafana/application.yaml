apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.1.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/gitops/clusters/observability/applications/grafana/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
