apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  project: default
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: charts/observability/storage
  destination:
    name: kloudlab-observability
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
