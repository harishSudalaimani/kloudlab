apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/observability/prometheus
      targetRevision: main
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/clusters/observability/applications/prometheus/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-observability
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
