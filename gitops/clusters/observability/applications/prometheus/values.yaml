kube-prometheus-stack:
  grafana:
    enabled: false

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 15d
      retentionSize: 40GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      podMonitorSelector: {}

  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  prometheus-node-exporter:
    enabled: false

  kube-state-metrics:
    enabled: false

  defaultRules:
    create: false
