apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-parameter-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: kloudlab-identity
  source:
    repoURL: https://github.com/harishSudalaimani/kloudlab.git
    targetRevision: main
    path: gitops/clusters/identity/applications/parameter-store
    directory:
      recurse: false
  destination:
    name: kloudlab-identity
    namespace: kloudlab-identity
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
