apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/cilium
      targetRevision: main
      helm:
        releaseName: cilium
        valueFiles:
          - $values/gitops/clusters/identity/values/cilium.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: kube-system
  # Keep sync manual until the EKS API endpoint is pinned in values/cilium.yaml
  # and the identity cluster is registered with Argo CD.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
