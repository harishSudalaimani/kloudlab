apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/external-secrets
      targetRevision: main
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/charts/external-secrets/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
