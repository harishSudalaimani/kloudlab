apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-otel-node-agent
  namespace: argocd
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/observability/opentelemetry-collector
      targetRevision: main
      helm:
        releaseName: otel-node-agent
        valueFiles:
          - $values/gitops/clusters/identity/applications/opentelemetry/node-agent/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: opentelemetry
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
