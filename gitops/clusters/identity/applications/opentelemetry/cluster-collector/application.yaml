apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-identity-otel-cluster-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/observability/opentelemetry-collector
      targetRevision: main
      helm:
        releaseName: otel-cluster-collector
        valueFiles:
          - $values/gitops/clusters/identity/applications/opentelemetry/cluster-collector/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: opentelemetry
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
