apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-infisical-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/infisical/secrets-operator
      targetRevision: main
      helm:
        releaseName: infisical-secrets-operator
        valueFiles:
          - $values/gitops/clusters/identity/applications/infisical/secrets-operator/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: kloudlab-identity
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
