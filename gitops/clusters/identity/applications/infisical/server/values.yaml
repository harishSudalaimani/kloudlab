infisical-standalone:
  infisical:
    enabled: true
    replicaCount: 2
    image:
      repository: infisical/infisical
      tag: v0.167.0
      pullPolicy: IfNotPresent
    kubeSecretRef: infisical-secrets
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 350m
        memory: 512Mi
      limits:
        memory: 1Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: infisical

  ingress:
    enabled: false
    nginx:
      enabled: false

  # Use the external PostgreSQL and Redis URLs supplied by the bootstrap Secret.
  postgresql:
    enabled: false
  redis:
    enabled: false
