apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kloudlab-infisical-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: kloudlab-identity
  sources:
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      path: charts/infisical/server
      targetRevision: main
      helm:
        releaseName: infisical
        valueFiles:
          - $values/gitops/clusters/identity/applications/infisical/server/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: kloudlab-identity
  # Sync manually after the bootstrap Secret and external data services exist.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
