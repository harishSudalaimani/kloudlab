apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openfga
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://openfga.github.io/helm-charts
      chart: openfga
      targetRevision: 0.3.16
      helm:
        releaseName: openfga
        valueFiles:
          - $values/gitops/clusters/identity/applications/openfga/values.yaml
    - repoURL: https://github.com/harishSudalaimani/kloudlab.git
      targetRevision: main
      ref: values
  destination:
    name: kloudlab-identity
    namespace: kloudlab-identity
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
