replicaCount: 3

service:
  type: ClusterIP

ingress:
  enabled: false

playground:
  enabled: false

postgresql:
  enabled: false
mysql:
  enabled: false

authn:
  method: preshared
  preshared:
    # Infisical syncs this secret with the `keys` key.
    keysSecret: kloudlab-openfga-auth

datastore:
  engine: postgres
  # Infisical syncs the private RDS connection URI into this secret.
  uriSecret: kloudlab-openfga-datastore
  applyMigrations: true
  waitForMigrations: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: openfga

log:
  format: json
  level: info

telemetry:
  metrics:
    enabled: true
    addr: 0.0.0.0:2112
    enableRPCHistograms: true
  trace:
    enabled: true
    otlp:
      endpoint: otel-node-agent.opentelemetry.svc.cluster.local:4317
      tls:
        enabled: false
    serviceName: openfga
    resourceAttributes: k8s.cluster.name=kloudlab-identity

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2112"
  prometheus.io/path: /metrics
