gatewayParameters:
  enabled: true
  name: public-aws-nlb
  service:
    extraAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

gateway:
  enabled: true
  name: public
  className: kgateway
  listener:
    name: http
    protocol: HTTP
    port: 80
    routeNamespaceLabel:
      key: kloudlab.dev/gateway-access
      value: public
