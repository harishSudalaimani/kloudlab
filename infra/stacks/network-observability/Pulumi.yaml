name: kloudlab-network-observability
runtime: go
main: .
description: Observability VPC for KloudLab across two Availability Zones in ap-south-1
config:
  aws:region:
    value: ap-south-1
  kloudlab-network:environment:
    value: dev
  kloudlab-network:cidrBlock:
    value: 10.30.0.0/16
  kloudlab-network:cidrInventoryReviewed:
    value: false
  kloudlab-network:reservedCIDRs:
    value:
      - 10.10.0.0/16
      - 10.20.0.0/16
      - 10.40.0.0/16
  kloudlab-network:connectedCIDRs:
    value: []
  kloudlab-network:availabilityZones:
    value:
      - ap-south-1a
      - ap-south-1b
  kloudlab-network:subnetPrefixLength:
    value: 20
  kloudlab-network:natGatewayMode:
    value: single
  kloudlab-network:protectVpc:
    value: true
