name: kloudlab-network-connectivity
runtime: go
main: .
description: Direct VPC peerings and private route entries between KloudLab cluster VPCs
config:
  aws:region:
    value: ap-south-1
  kloudlab-connectivity:environment:
    value: dev
  kloudlab-connectivity:appNetworkStack:
    value: kloudlab-network-app/dev
  kloudlab-connectivity:identityNetworkStack:
    value: kloudlab-network-identity/dev
  kloudlab-connectivity:observabilityNetworkStack:
    value: kloudlab-network-observability/dev
  kloudlab-connectivity:managementNetworkStack:
    value: kloudlab-network-management/dev
  kloudlab-connectivity:privateRouteTableCount:
    value: 2
  kloudlab-connectivity:protectConnections:
    value: true
