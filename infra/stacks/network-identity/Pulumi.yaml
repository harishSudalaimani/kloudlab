name: kloudlab-network-identity
runtime: go
main: .
description: Identity VPC for KloudLab in ap-south-1
config:
  aws:region:
    default: ap-south-1
  kloudlab-network:environment:
    default: dev
  kloudlab-network:cidrBlock:
    default: 10.20.0.0/16
  kloudlab-network:cidrInventoryReviewed:
    default: false
  kloudlab-network:peerCIDRs:
    default:
      - 10.10.0.0/16
      - 10.30.0.0/16
  kloudlab-network:connectedCIDRs:
    default: []
  kloudlab-network:availabilityZones:
    default:
      - ap-south-1a
      - ap-south-1b
      - ap-south-1c
  kloudlab-network:subnetPrefixLength:
    default: 20
  kloudlab-network:natGatewayMode:
    default: single
  kloudlab-network:protectVpc:
    default: true
