name: kloudlab-cluster-app
runtime: go
main: .
description: Private-worker EKS cluster and managed baseline node group for KloudLab app
config:
  aws:region:
    value: ap-south-1
  kloudlab-cluster:environment:
    value: dev
  kloudlab-cluster:clusterName:
    value: kloudlab-app
  kloudlab-cluster:networkStack:
    value: organization/kloudlab-network-app/dev
  kloudlab-cluster:managementNetworkStack:
    value: organization/kloudlab-network-management/dev
  kloudlab-cluster:kubernetesVersion:
    value: "1.36"
  kloudlab-cluster:publicAccessCidrs:
    value: []
  kloudlab-cluster:publicEndpointAccess:
    value: true
  kloudlab-cluster:privateEndpointAccess:
    value: true
  kloudlab-cluster:instanceTypes:
    value:
      - t3.medium
  kloudlab-cluster:minSize:
    value: 3
  kloudlab-cluster:desiredSize:
    value: 3
  kloudlab-cluster:maxSize:
    value: 4
  kloudlab-cluster:diskSizeGiB:
    value: 30
  kloudlab-cluster:enableMetricsServer:
    value: true
  kloudlab-cluster:enablePodIdentityAgent:
    value: true
  kloudlab-cluster:enableEBSCSIDriver:
    value: true
  kloudlab-cluster:protectCluster:
    value: true
