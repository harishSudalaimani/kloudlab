apiVersion: v1
kind: Namespace
metadata:
  name: lab-SESSION_ID
  labels:
    kloudlab.io/session-id: SESSION_ID
    kloudlab.io/owner-hash: OWNER_HASH
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: lab-SESSION_ID
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    persistentvolumeclaims: "2"
    requests.storage: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: lab-SESSION_ID
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 1
        memory: 1Gi
      max:
        cpu: "2"
        memory: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: lab-SESSION_ID
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
