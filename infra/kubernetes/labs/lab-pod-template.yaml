apiVersion: apps/v1
kind: Deployment
metadata:
  name: guided-exercise
  namespace: lab-SESSION_ID
  labels:
    kloudlab.io/session-id: SESSION_ID
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guided-exercise
  template:
    metadata:
      labels:
        app: guided-exercise
        kloudlab.io/session-id: SESSION_ID
    spec:
      nodeSelector:
        workload: student-labs
      tolerations:
        - key: workload
          operator: Equal
          value: student-labs
          effect: NoSchedule
      containers:
        - name: exercise
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kloudlab/labs:GUIDED_LAB_VERSION
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
