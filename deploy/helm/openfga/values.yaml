openfga:
  replicaCount: 3

  service:
    type: ClusterIP

  ingress:
    enabled: false

  playground:
    enabled: false

  postgresql:
    enabled: false
  mysql:
    enabled: false

  authn:
    method: preshared
    preshared:
      # Create this Secret through the configured secret manager. It must have
      # a `keys` key containing the OpenFGA pre-shared key list.
      keysSecret: kloudlab-openfga-auth

  datastore:
    engine: postgres
    # CloudNativePG's read/write service in this Helm release namespace.
    uri: postgres://openfga-postgres-rw:5432/openfga?sslmode=require
    existingSecret: openfga-postgres-app
    secretKeys:
      usernameKey: username
      passwordKey: password
    applyMigrations: true
    waitForMigrations: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: openfga

  log:
    format: json
    level: info
